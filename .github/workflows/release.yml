name: release

on:
  push:
    branches-ignore: ['renovate/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      local_release:
        description: "Cut a -mavericks.(N+1) repackage of the current upstream"
        type: boolean
        default: false
      reconcile:
        description: "Set by the nightly reconcile backstop"
        type: boolean
        default: false

permissions:
  contents: read

# spec: shipyard SKILL.md "Release workflow" -- a run that can publish is alone in its group
concurrency:
  group: >-
    release-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.ver.outputs.full }}
      publish: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: Mavergreen/shipyard/.github/actions/install@v1
      - id: ver
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LOCAL_RELEASE: ${{ inputs.local_release }}
          RECONCILE: ${{ inputs.reconcile }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          effective_local_release="$LOCAL_RELEASE"
          if [ "$RECONCILE" = true ]; then effective_local_release=true; fi
          mode="$(LOCAL_RELEASE="$effective_local_release" sh "$SHIPYARD_SCRIPTS/release-mode.sh")"
          out="$(sh build/version.sh "$mode")"
          full="$(printf '%s\n' "$out" | sed -n 's/^FULL=//p')"
          rel="$(printf '%s\n' "$out" | sed -n 's/^RELEASE=//p')"
          [ -n "$full" ] || { echo "::error::version.sh gave no FULL= line: $out"; exit 1; }
          # spec: SKILL.md "Release workflow" -- only a push to main or an explicit dispatch publishes
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            push:refs/heads/main|workflow_dispatch:*) : ;;
            *) rel=no ;;
          esac
          # spec: SKILL.md "A release is a declared state" -- a reconcile dispatch publishes only while no release carries this state
          if [ "$rel" = yes ] && [ "$RECONCILE" = true ]; then
            digest="$(sh "$SHIPYARD_SCRIPTS/release-state.sh")"
            answer="$(sh "$SHIPYARD_SCRIPTS/release-needed.sh" --digest "$digest" --version "$full")"
            echo "release-needed: $answer"
            [ "$answer" = PUBLISH ] || rel=no
          fi
          { echo "full=$full"; echo "release=$rel"; } >> "$GITHUB_OUTPUT"
          echo "version=$full publish=$rel"

  build:
    needs: ver
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      V: ${{ needs.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: Mavergreen/shipyard/.github/actions/install@v1
      - name: Record the pre-build tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record
      - name: The locked build container
        run: docker build --build-arg "BASE_IMAGE=$(cat build/linux/base-image)" -t cctools-build build/linux
      - name: Build all three variants, smoke each as far as Linux runs it, and package them, in the container
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/work/home" dist
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src" -v "$SHIPYARD_SCRIPTS:/shipyard:ro" -v "$RUNNER_TEMP/work:/work" -w /src \
            -e SHIPYARD_SCRIPTS=/shipyard -e MAVERICKS_BUILD_ROOT=/work/mm-build -e HOME=/work/home -e V \
            -e SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/src \
            cctools-build sh -c 'sh build/build-release.sh --version "$V" --out /src/dist && CCT_STAGE=/work/mm-build/cctools/release/stage-linux sh /shipyard/run-repo-tests.sh --strict-host'
      - name: Ingredient pins are well declared
        run: sh "$SHIPYARD_SCRIPTS/check-ingredient-pins.sh"
      - name: Attach the source the builds verified, so the APSL source offer outlives cctools-port's repository
        run: |
          set -eu
          commit="$(awk '{ print $2 }' components/cctools-port/version)"
          tarball="cctools-port-$commit.tar.gz"
          cp "$RUNNER_TEMP/work/home/Library/Caches/mavericks-sources/$tarball" "dist/$tarball"
          printf '%s  %s\n' "$(tr -d '[:space:]' < components/cctools-port/sha256)" "$tarball" > "$RUNNER_TEMP/source.sha256"
          ( cd dist && sha256sum -c "$RUNNER_TEMP/source.sha256" )
          tar --sort=name --mtime="@$(git log -1 --format=%ct)" --owner=0 --group=0 --numeric-owner -cf - patches \
            | gzip -n -9 > "dist/cctools-$V-patches.tar.gz"
      - name: Release notes
        run: |
          sh "$SHIPYARD_SCRIPTS/release-notes.sh" --tag "$V" --version "$V" --product cctools \
            --min-os 10.9.5 --out dist/RELEASE_NOTES.md
      - name: Record the declared state in the notes
        run: |
          set -eu
          digest="$(sh "$SHIPYARD_SCRIPTS/release-state.sh")"
          sh "$SHIPYARD_SCRIPTS/release-state-record.sh" --notes-file dist/RELEASE_NOTES.md --digest "$digest"
      - name: clang22's Mach-O readers, for the steps that read the pkg
        run: |
          set -eu
          CL="$(sh build/fetch-clang22.sh)"
          { echo "LIPO=$CL/bin/llvm-lipo"; echo "OTOOL=$CL/bin/llvm-otool"; echo "NM=$CL/bin/llvm-nm"; } >> "$GITHUB_ENV"
      - name: Sign the pkg and write its feed
        if: needs.ver.outputs.publish == 'yes'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          printenv SPARKLE_PRIVATE_KEY | grep -q . || { echo "::error::SPARKLE_PRIVATE_KEY is not visible to this repo"; exit 1; }
          sh "$SHIPYARD_SCRIPTS/sign_and_appcast.sh" --product cctools --feed-dir dist \
            --channel-title "cctools for Mavericks" --version "$V" \
            --pkg-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/$V/cctools-$V.pkg" \
            --notes-file dist/RELEASE_NOTES.md --pkg "dist/cctools-$V.pkg" --min-os 10.9.5
      - name: Unsigned stand-in feed (never published)
        if: needs.ver.outputs.publish != 'yes'
        run: sh "$SHIPYARD_SCRIPTS/stand-in-feeds.sh" dist "$V"
      - name: Artifact conformance
        run: |
          set -eu
          facts="$(sh "$SHIPYARD_SCRIPTS/artifact-facts.sh" dist "$V")"
          printf '%s\n' "$facts" | sh "$SHIPYARD_SCRIPTS/check-artifact-conformance.sh"
      - name: The feed is an upgrade
        if: needs.ver.outputs.publish == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh "$SHIPYARD_SCRIPTS/assert_appcast_upgradeable.sh" --appcast dist/cctools.xml --version "$V"
      - uses: actions/upload-artifact@v7
        with:
          name: mavergreen-cctools
          if-no-files-found: error
          path: |
            dist/*.pkg
            dist/*.tar.gz
            dist/*.xml
            dist/RELEASE_NOTES.md
      - name: The build must not have written into the source tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh"

  linux-smoke:
    needs: [ver, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      V: ${{ needs.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v8
        with: { name: mavergreen-cctools, path: dist }
      - name: The archive, installed as the README says on this runner's own Ubuntu, runs
        run: |
          set -eu
          sudo mkdir -p /opt/mavergreen
          sudo tar -C /opt/mavergreen -xzf "dist/cctools-$V-linux-x86_64.tar.gz"
          CCT_STAGE=/ sh tests/smoke-test.sh

  vm-test:
    needs: [ver, build]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v8
        with: { name: mavergreen-cctools, path: dist }
      - name: Install the pkg on Mac OS X 10.9, link a kext with it, and have the kernel load it
        uses: Mavergreen/mavericks-vm@v1
        env:
          CCT_VERSION: ${{ needs.ver.outputs.version }}
        with:
          image-key: ${{ secrets.MAVERICKS_VM_KEY }}
          envs: CCT_VERSION
          copyback: false
          run: |
            sw_vers
            sudo -n true || { echo "the guest's user cannot sudo without a password, and installer needs root"; exit 1; }
            sudo installer -pkg "dist/cctools-$CCT_VERSION.pkg" -target /
            /usr/local/bin/mavergreen check
            CCT_STAGE=/ sh tests/smoke-test.sh
            sudo CCT_STAGE=/ sh tests/kext-load-test.sh

  modern-smoke:
    needs: [ver, build]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || startsWith(github.head_ref, 'renovate/')
    runs-on: macos-26
    timeout-minutes: 20
    env:
      V: ${{ needs.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v8
        with: { name: mavergreen-cctools, path: dist }
      - name: Install the pkg, and run its arm64 slice
        run: |
          set -eu
          [ "$(uname -m)" = arm64 ] && [ "$(arch)" = arm64 ] || { echo "::error::this runner is not running arm64 natively"; exit 1; }
          sudo installer -pkg "dist/cctools-$V.pkg" -target /
          /usr/local/bin/mavergreen check
          CCT_STAGE=/ sh tests/smoke-test.sh
          /usr/local/mavergreen/bin/ld -v 2>&1 | grep -q 'PROJECT:ld64-957.1'

  scan:
    needs: [ver, build]
    if: always() && needs.ver.outputs.publish == 'yes'
    permissions: { actions: read, contents: read }
    uses: Mavergreen/shipyard/.github/workflows/scan-for-key.yml@v1
    with: { artifact: mavergreen-cctools }
    secrets: { SPARKLE_PRIVATE_KEY: "${{ secrets.SPARKLE_PRIVATE_KEY }}" }

  publish:
    needs: [ver, build, linux-smoke, vm-test, modern-smoke, scan]
    if: needs.ver.outputs.publish == 'yes'
    permissions: { contents: write }
    uses: Mavergreen/shipyard/.github/workflows/publish-release.yml@v1
    with: { version: "${{ needs.ver.outputs.version }}", artifact: mavergreen-cctools }

  retry:
    needs: [ver, publish]
    if: always() && needs.publish.result == 'failure'
    permissions: { contents: read, actions: write }
    uses: Mavergreen/shipyard/.github/workflows/retry-release.yml@v1
    with: { version: "${{ needs.ver.outputs.version }}" }

  required:
    name: required (release)
    if: always()
    needs: [ver, build, linux-smoke, vm-test, modern-smoke, scan, publish, retry]
    runs-on: ubuntu-latest
    steps:
      - uses: Mavergreen/shipyard/.github/actions/required-gate@v1
        with:
          needs: ${{ toJSON(needs) }}
